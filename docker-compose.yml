version: '3.8'

services:
  openfamily:
    build: .
    image: openfamily:latest
    container_name: openfamily
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATA_DIR=/app/data
      - TZ=${TZ:-Europe/Madrid}
      - CITY_NAME=${CITY_NAME:-Mi Ciudad}
      - LATITUDE=${LATITUDE:-40.4168}
      - LONGITUDE=${LONGITUDE:--3.7038}
      - PARENT_PIN=${PARENT_PIN:-1234}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-Admin1234.}
      - AUTH_SECRET=${AUTH_SECRET:-OpenFamilySecretKey_ChangeMeInProd_2026}
      - KIOSK_TOKEN=${KIOSK_TOKEN:-kiosk_openfamily_token_secure}
      - ICAL_URL=${ICAL_URL:-}
    volumes:
      # Datos persistentes de SQLite y fotos familiares
      - ./data:/app/data
      # Archivos estáticos de interfaz web (actualizaciones instantáneas)
      - ./public:/app/public
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 5s
      retries: 3
